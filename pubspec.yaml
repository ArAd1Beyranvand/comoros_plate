version: 0.1.0
repository: https://github.com/ArAd1Beyranvand/comoros_plate
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.12.0
  plate_alphabet: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
